      <rect x="670" y="30" width="280" height="550" rx="8" fill="rgba(59,119,204,0.03)" stroke="rgba(59,119,204,0.25)" stroke-width="1"/>
      <rect x="682" y="38" width="180" height="18" rx="3" fill="#faf7f2" stroke="rgba(59,119,204,0.35)" stroke-width="0.8"/>
