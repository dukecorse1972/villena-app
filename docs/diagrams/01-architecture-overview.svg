<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#556350"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#c4972a"/>
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#3b77cc"/>
        </marker>
      </defs>

      <!-- Fondo limpio -->
      <rect width="100%" height="100%" fill="#faf7f2"/>

      <!-- ── ZONAS / TIERS ────────────────────────────────────── -->
      
      <!-- Zona 1: Frontend SPA (React 18) -->
      <rect x="30" y="30" width="280" height="550" rx="8" fill="rgba(30,36,28,0.02)" stroke="rgba(30,36,28,0.12)" stroke-width="1"/>
      <rect x="42" y="38" width="160" height="18" rx="3" fill="#faf7f2" stroke="rgba(30,36,28,0.15)" stroke-width="0.8"/>
      <text x="122" y="51" fill="#556350" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">CAPA UI / REACT 18 SPA</text>

      <!-- Zona 2: Integración Nativa (Capacitor Bridge) -->
      <rect x="350" y="30" width="280" height="260" rx="8" fill="rgba(196,151,42,0.03)" stroke="rgba(196,151,42,0.30)" stroke-dasharray="4,4" stroke-width="1"/>
      <rect x="362" y="38" width="170" height="18" rx="3" fill="#faf7f2" stroke="rgba(196,151,42,0.4)" stroke-width="0.8"/>
      <text x="447" y="51" fill="#c4972a" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">CAPACITOR NATIVE BRIDGE</text>

      <!-- Zona 3: Capa de Servicios &amp; Resiliencia -->
      <rect x="350" y="320" width="280" height="260" rx="8" fill="rgba(30,36,28,0.02)" stroke="rgba(30,36,28,0.12)" stroke-width="1"/>
