      <text x="408" y="380" fill="#556350" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">CACHE</text>
      <text x="490" y="395" fill="#1e241c" font-size="12" font-weight="700" font-family="'Lato', sans-serif" text-anchor="middle">Capa de Resiliencia</text>
      <text x="490" y="420" fill="#556350" font-size="9.5" font-family="'Lato', sans-serif" text-anchor="middle">createPersistentCache (TTL + Stale)</text>
