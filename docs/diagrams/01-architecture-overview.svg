      <!-- UI -> Capacitor Plugins -->
      <!-- App.tsx -> Native Hooks -->
      <path d="M 270,110 H 305 Q 315,110 315,110 H 380" fill="none" stroke="#c4972a" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="290" y="96" width="70" height="14" rx="2" fill="#faf7f2"/>
      <text x="325" y="106" fill="#c4972a" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">HARDWARE</text>

