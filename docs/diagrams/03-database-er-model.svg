<svg viewBox="0 0 1020 620" xmlns="http://www.w3.org/2000/svg">
      <defs>
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Lato:wght@400;600;700&family=Geist+Mono:wght@400;500;600&display=swap');
        text { font-family: 'Lato', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      </style>

        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#556350"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#c4972a"/>
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#3b77cc"/>
        </marker>
      </defs>

      <!-- Fondo limpio -->
      <rect width="100%" height="100%" fill="#faf7f2"/>

      <!-- ── RELACIONES / CONECTORES (1:N y 1:1) ───────────────── -->

      <!-- comparsas (1) -> cargos (N) -->
      <!-- desde comparsas.id (x=270, y=100) a cargos.comparsa_id (x=380, y=130) -->
      <path d="M 270,110 H 325 Q 335,110 335,130 H 380" fill="none" stroke="#c4972a" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="290" y="96" width="38" height="14" rx="2" fill="#faf7f2"/>
      <text x="309" y="106" fill="#c4972a" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">1 : N</text>

      <!-- rutas (1) -> eventos (N) -->
      <!-- desde rutas.id (x=620, y=410) a eventos.ruta_id (x=730, y=250) -->
      <path d="M 620,410 H 675 Q 685,410 685,250 H 730" fill="none" stroke="#3b77cc" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="640" y="325" width="46" height="14" rx="2" fill="#faf7f2"/>
      <text x="663" y="335" fill="#3b77cc" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">0..1 : N</text>

      <!-- comparsas (1) -> pois (sedes / locales) -->
      <!-- desde comparsas.id (x=160, y=300) a pois (x=160, y=360) -->
      <path d="M 160,300 V 360" fill="none" stroke="#556350" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="135" y="325" width="50" height="14" rx="2" fill="#faf7f2"/>
      <text x="160" y="335" fill="#556350" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">SEDES</text>

      <!-- avisos -> push_tokens (Trigger / Broadcast) -->
      <!-- desde avisos (x=500, y=250) a push_tokens (x=500, y=290) -->
      <path d="M 500,240 V 290" fill="none" stroke="#c4972a" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="465" y="258" width="70" height="14" rx="2" fill="#faf7f2"/>
      <text x="500" y="268" fill="#c4972a" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">TRIGGER PUSH</text>


      <!-- ── TABLAS / ENTIDADES ER ──────────────────────────── -->

      <!-- TABLA: comparsas -->
      <g transform="translate(30, 40)">
        <rect x="0" y="0" width="240" height="260" rx="6" fill="#ffffff" stroke="#c4972a" stroke-width="1.2"/>
        <path d="M 0,0 H 240 V 32 H 0 Z" fill="rgba(196,151,42,0.12)" rx="6"/>
        <text x="12" y="21" fill="#1e241c" font-size="12" font-weight="700" font-family="'Lato', sans-serif">comparsas</text>
        <text x="228" y="21" fill="#c4972a" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">TABLE</text>
        
        <!-- Columnas -->
        <text x="12" y="52" fill="#c4972a" font-size="9" font-family="'Geist Mono', monospace" font-weight="bold">PK id</text>
        <text x="130" y="52" fill="#556350" font-size="9" font-family="'Geist Mono', monospace">text</text>

        <text x="12" y="74" fill="#1e241c" font-size="9" font-family="'Geist Mono', monospace">name</text>
        <text x="130" y="74" fill="#556350" font-size="9" font-family="'Geist Mono', monospace">text</text>

        <text x="12" y="96" fill="#1e241c" font-size="9" font-family="'Geist Mono', monospace">bando</text>
        <text x="130" y="96" fill="#7e8c79" font-size="8.5" font-family="'Geist Mono', monospace">'Moro'|'Cristiano'</text>

        <text x="12" y="118" fill="#1e241c" font-size="9" font-family="'Geist Mono', monospace">color</text>
        <text x="130" y="118" fill="#556350" font-size="9" font-family="'Geist Mono', monospace">text (hex)</text>

        <text x="12" y="140" fill="#1e241c" font-size="9" font-family="'Geist Mono', monospace">founded_year</text>
        <text x="130" y="140" fill="#556350" font-size="9" font-family="'Geist Mono', monospace">integer</text>

        <text x="12" y="162" fill="#1e241c" font-size="9" font-family="'Geist Mono', monospace">num_socios</text>
        <text x="130" y="162" fill="#556350" font-size="9" font-family="'Geist Mono', monospace">integer</text>

        <text x="12" y="184" fill="#1e241c" font-size="9" font-family="'Geist Mono', monospace">description</text>
        <text x="130" y="184" fill="#556350" font-size="9" font-family="'Geist Mono', monospace">text</text>

        <text x="12" y="206" fill="#1e241c" font-size="9" font-family="'Geist Mono', monospace">img</text>
        <text x="130" y="206" fill="#556350" font-size="9" font-family="'Geist Mono', monospace">text (url)</text>

        <text x="12" y="228" fill="#1e241c" font-size="9" font-family="'Geist Mono', monospace">desfile_img</text>
        <text x="130" y="228" fill="#556350" font-size="9" font-family="'Geist Mono', monospace">text (url)</text>

        <text x="12" y="250" fill="#1e241c" font-size="9" font-family="'Geist Mono', monospace">traje_gala_img</text>
        <text x="130" y="250" fill="#556350" font-size="9" font-family="'Geist Mono', monospace">text (url)</text>
      </g>

      <!-- TABLA: cargos -->
      <g transform="translate(380, 40)">
        <rect x="0" y="0" width="240" height="175" rx="6" fill="#ffffff" stroke="#1e241c" stroke-width="1"/>
        <path d="M 0,0 H 240 V 32 H 0 Z" fill="rgba(30,36,28,0.06)" rx="6"/>
        <text x="12" y="21" fill="#1e241c" font-size="12" font-weight="700" font-family="'Lato', sans-serif">cargos</text>
        <text x="228" y="21" fill="#556350" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">TABLE</text>
        
        <text x="12" y="52" fill="#c4972a" font-size="9" font-family="'Geist Mono', monospace" font-weight="bold">PK id</text>
        <text x="130" y="52" fill="#556350" font-size="9" font-family="'Geist Mono', monospace">uuid</text>

        <text x="12" y="74" fill="#3b77cc" font-size="9" font-family="'Geist Mono', monospace" font-weight="bold">FK comparsa_id</text>
        <text x="130" y="74" fill="#556350" font-size="9" font-family="'Geist Mono', monospace">text → comparsas</text>

        <text x="12" y="96" fill="#1e241c" font-size="9" font-family="'Geist Mono', monospace">role</text>
        <text x="130" y="96" fill="#556350" font-size="9" font-family="'Geist Mono', monospace">text (Capitán...)</text>

        <text x="12" y="118" fill="#1e241c" font-size="9" font-family="'Geist Mono', monospace">person_name</text>
        <text x="130" y="118" fill="#556350" font-size="9" font-family="'Geist Mono', monospace">text</text>

        <text x="12" y="140" fill="#1e241c" font-size="9" font-family="'Geist Mono', monospace">photo_url</text>
        <text x="130" y="140" fill="#556350" font-size="9" font-family="'Geist Mono', monospace">text (nullable)</text>

        <text x="12" y="162" fill="#1e241c" font-size="9" font-family="'Geist Mono', monospace">sort_order</text>
        <text x="130" y="162" fill="#556350" font-size="9" font-family="'Geist Mono', monospace">integer</text>
      </g>

      <!-- TABLA: eventos (actos) -->
      <g transform="translate(730, 40)">
        <rect x="0" y="0" width="260" height="235" rx="6" fill="#ffffff" stroke="#3b77cc" stroke-width="1.2"/>
        <path d="M 0,0 H 260 V 32 H 0 Z" fill="rgba(59,119,204,0.1)" rx="6"/>
        <text x="12" y="21" fill="#1e241c" font-size="12" font-weight="700" font-family="'Lato', sans-serif">eventos (FiestaEvent)</text>
        <text x="248" y="21" fill="#3b77cc" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">TABLE</text>
        
        <text x="12" y="52" fill="#c4972a" font-size="9" font-family="'Geist Mono', monospace" font-weight="bold">PK id</text>
        <text x="140" y="52" fill="#556350" font-size="9" font-family="'Geist Mono', monospace">text / uuid</text>

        <text x="12" y="74" fill="#1e241c" font-size="9" font-family="'Geist Mono', monospace">date</text>
        <text x="140" y="74" fill="#556350" font-size="9" font-family="'Geist Mono', monospace">date ('YYYY-MM-DD')</text>

        <text x="12" y="96" fill="#1e241c" font-size="9" font-family="'Geist Mono', monospace">time</text>
        <text x="140" y="96" fill="#556350" font-size="9" font-family="'Geist Mono', monospace">text ('HH:mm')</text>

        <text x="12" y="118" fill="#1e241c" font-size="9" font-family="'Geist Mono', monospace">title</text>
        <text x="140" y="118" fill="#556350" font-size="9" font-family="'Geist Mono', monospace">text</text>

        <text x="12" y="140" fill="#1e241c" font-size="9" font-family="'Geist Mono', monospace">location</text>
        <text x="140" y="140" fill="#556350" font-size="9" font-family="'Geist Mono', monospace">text</text>

        <text x="12" y="162" fill="#1e241c" font-size="9" font-family="'Geist Mono', monospace">type</text>
        <text x="140" y="162" fill="#7e8c79" font-size="8.5" font-family="'Geist Mono', monospace">EventType enum</text>

        <text x="12" y="184" fill="#3b77cc" font-size="9" font-family="'Geist Mono', monospace" font-weight="bold">FK ruta_id</text>
        <text x="140" y="184" fill="#556350" font-size="9" font-family="'Geist Mono', monospace">uuid → rutas</text>

        <text x="12" y="206" fill="#1e241c" font-size="9" font-family="'Geist Mono', monospace">description</text>
        <text x="140" y="206" fill="#556350" font-size="9" font-family="'Geist Mono', monospace">text (nullable)</text>

        <text x="12" y="228" fill="#1e241c" font-size="9" font-family="'Geist Mono', monospace">img_url</text>
        <text x="140" y="228" fill="#556350" font-size="9" font-family="'Geist Mono', monospace">text (url)</text>
      </g>

      <!-- TABLA: pois (Puntos de Interés / Sedes) -->
      <g transform="translate(30, 360)">
        <rect x="0" y="0" width="240" height="195" rx="6" fill="#ffffff" stroke="#1e241c" stroke-width="1"/>
        <path d="M 0,0 H 240 V 32 H 0 Z" fill="rgba(30,36,28,0.06)" rx="6"/>
        <text x="12" y="21" fill="#1e241c" font-size="12" font-weight="700" font-family="'Lato', sans-serif">pois (Puntos Interés)</text>
        <text x="228" y="21" fill="#556350" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">TABLE</text>
        
        <text x="12" y="52" fill="#c4972a" font-size="9" font-family="'Geist Mono', monospace" font-weight="bold">PK id</text>
        <text x="130" y="52" fill="#556350" font-size="9" font-family="'Geist Mono', monospace">text / uuid</text>

        <text x="12" y="74" fill="#1e241c" font-size="9" font-family="'Geist Mono', monospace">name</text>
        <text x="130" y="74" fill="#556350" font-size="9" font-family="'Geist Mono', monospace">text</text>

        <text x="12" y="96" fill="#1e241c" font-size="9" font-family="'Geist Mono', monospace">lat / lng</text>
        <text x="130" y="96" fill="#556350" font-size="9" font-family="'Geist Mono', monospace">double precision</text>

        <text x="12" y="118" fill="#1e241c" font-size="9" font-family="'Geist Mono', monospace">category</text>
        <text x="130" y="118" fill="#556350" font-size="9" font-family="'Geist Mono', monospace">text ('sede'..)</text>

        <text x="12" y="140" fill="#1e241c" font-size="9" font-family="'Geist Mono', monospace">icon</text>
        <text x="130" y="140" fill="#556350" font-size="9" font-family="'Geist Mono', monospace">text ('shield'..)</text>

        <text x="12" y="162" fill="#1e241c" font-size="9" font-family="'Geist Mono', monospace">description</text>
        <text x="130" y="162" fill="#556350" font-size="9" font-family="'Geist Mono', monospace">text</text>

        <text x="12" y="184" fill="#1e241c" font-size="9" font-family="'Geist Mono', monospace">comparsa_id</text>
        <text x="130" y="184" fill="#556350" font-size="9" font-family="'Geist Mono', monospace">text (nullable)</text>
      </g>

      <!-- TABLA: rutas -->
      <g transform="translate(380, 360)">
        <rect x="0" y="0" width="240" height="135" rx="6" fill="#ffffff" stroke="#3b77cc" stroke-width="1"/>
        <path d="M 0,0 H 240 V 32 H 0 Z" fill="rgba(59,119,204,0.08)" rx="6"/>
        <text x="12" y="21" fill="#1e241c" font-size="12" font-weight="700" font-family="'Lato', sans-serif">rutas (Desfiles)</text>
        <text x="228" y="21" fill="#3b77cc" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">TABLE</text>
        
        <text x="12" y="52" fill="#c4972a" font-size="9" font-family="'Geist Mono', monospace" font-weight="bold">PK id</text>
        <text x="130" y="52" fill="#556350" font-size="9" font-family="'Geist Mono', monospace">uuid</text>

        <text x="12" y="74" fill="#1e241c" font-size="9" font-family="'Geist Mono', monospace">name</text>
        <text x="130" y="74" fill="#556350" font-size="9" font-family="'Geist Mono', monospace">text</text>

        <text x="12" y="96" fill="#1e241c" font-size="9" font-family="'Geist Mono', monospace">path</text>
        <text x="130" y="96" fill="#7e8c79" font-size="8.5" font-family="'Geist Mono', monospace">jsonb ([lat,lng][])</text>

        <text x="12" y="118" fill="#1e241c" font-size="9" font-family="'Geist Mono', monospace">created_at</text>
        <text x="130" y="118" fill="#556350" font-size="9" font-family="'Geist Mono', monospace">timestamptz</text>
      </g>

      <!-- TABLA: avisos -->
      <g transform="translate(380, 230)">
        <rect x="0" y="0" width="240" height="110" rx="6" fill="#ffffff" stroke="#1e241c" stroke-width="1"/>
        <path d="M 0,0 H 240 V 28 H 0 Z" fill="rgba(30,36,28,0.06)" rx="6"/>
        <text x="12" y="19" fill="#1e241c" font-size="11" font-weight="700" font-family="'Lato', sans-serif">avisos</text>
        <text x="228" y="19" fill="#556350" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">TABLE</text>
        
        <text x="12" y="46" fill="#c4972a" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="bold">PK id</text>
        <text x="130" y="46" fill="#556350" font-size="8.5" font-family="'Geist Mono', monospace">uuid</text>

        <text x="12" y="66" fill="#1e241c" font-size="8.5" font-family="'Geist Mono', monospace">text</text>
        <text x="130" y="66" fill="#556350" font-size="8.5" font-family="'Geist Mono', monospace">text</text>

        <text x="12" y="86" fill="#1e241c" font-size="8.5" font-family="'Geist Mono', monospace">is_new / created_at</text>
        <text x="130" y="86" fill="#556350" font-size="8.5" font-family="'Geist Mono', monospace">bool / timestamptz</text>
      </g>

      <!-- TABLA: push_tokens -->
      <g transform="translate(730, 340)">
        <rect x="0" y="0" width="260" height="155" rx="6" fill="#ffffff" stroke="#c4972a" stroke-width="1"/>
        <path d="M 0,0 H 260 V 32 H 0 Z" fill="rgba(196,151,42,0.1)" rx="6"/>
        <text x="12" y="21" fill="#1e241c" font-size="12" font-weight="700" font-family="'Lato', sans-serif">push_tokens</text>
        <text x="248" y="21" fill="#c4972a" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">TABLE</text>
        
        <text x="12" y="52" fill="#c4972a" font-size="9" font-family="'Geist Mono', monospace" font-weight="bold">PK id</text>
        <text x="140" y="52" fill="#556350" font-size="9" font-family="'Geist Mono', monospace">uuid</text>

        <text x="12" y="74" fill="#1e241c" font-size="9" font-family="'Geist Mono', monospace">token</text>
        <text x="140" y="74" fill="#556350" font-size="9" font-family="'Geist Mono', monospace">text (unique)</text>

        <text x="12" y="96" fill="#1e241c" font-size="9" font-family="'Geist Mono', monospace">platform</text>
        <text x="140" y="96" fill="#7e8c79" font-size="8.5" font-family="'Geist Mono', monospace">'ios' | 'android' | 'web'</text>

        <text x="12" y="118" fill="#1e241c" font-size="9" font-family="'Geist Mono', monospace">updated_at</text>
        <text x="140" y="118" fill="#556350" font-size="9" font-family="'Geist Mono', monospace">timestamptz</text>

        <text x="12" y="140" fill="#7e8c79" font-size="8" font-family="'Geist Mono', monospace">RLS: anon INSERT/UPDATE</text>
      </g>

    </svg>